version: '3.8'
volumes:
  prometheus_data: {}
  grafana_data: {}
  alertmanager_data: {}

networks:
  pavlushkin-va-my-netology-hw:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16

services:

  pavlushkin-va-alertmanager:
    image: prom/alertmanager:latest
    container_name: pavlushkin-va-netology-alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/:/etc/alertmanager/
      - alertmanager_data:/alertmanager
    networks:
      pavlushkin-va-my-netology-hw:
        ipv4_address: 10.5.0.5

  pavlushkin-va-pushgateway:
    image: prom/pushgateway:v1.6.0
    container_name: pavlushkin-va-netology-pushgateway
    restart: always
    ports:
      - "9091:9091"
    networks:
      pavlushkin-va-my-netology-hw:
        ipv4_address: 10.5.0.3

  pavlushkin-va-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: pavlushkin-va-netology-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - pavlushkin-va-alertmanager
      - pavlushkin-va-pushgateway
    networks:
      pavlushkin-va-my-netology-hw:
        ipv4_address: 10.5.0.2

  pavlushkin-va-grafana:
    image: grafana/grafana:10.0.0
    container_name: pavlushkin-va-netology-grafana
    restart: always
    ports:
      - "80:3000"
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
      - ./grafana/custom.ini:/etc/grafana/grafana.ini
    depends_on:
      - pavlushkin-va-prometheus
    networks:
      pavlushkin-va-my-netology-hw:
        ipv4_address: 10.5.0.4
